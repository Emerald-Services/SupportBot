# SupportBot Temporary Voice Channels Configuration
# Addon Version 1.0

Enabled: true

# The ID of the voice channel that users join to create a new one
JoinToCreateChannelID: "CHANNEL_ID"

# The category ID where new channels should be created (Optional)
# If left blank, it will create it in the same category as the JoinToCreate channel
CategoryID: "CATEGORY_ID"

# The name pattern for new channels

# Placeholders:
# {user}: Username
ChannelNamePattern: "🔊 {user}'s Channel"

# Should the channel be deleted when the last person leaves?
AutoDelete: true

# Voice Channel Hub (Control Panel)
Hub:
  Enabled: true
  SendOnCreate: true
  LayoutStyle: "classic" # classic | modern

  # Classic Layout Settings (Standard Embed + Buttons)
  Classic:
    Title: "Voice Channel Hub"
    Description: "Manage your voice channel using the buttons below."
    Color: "#57F287"

  # Modern Layout Settings (V2 Containers)
  Modern:
    Title: "Voice Channel Controller"
    Body: "Control temporary voice channel using this control panel."
    Color: "#57F287"
