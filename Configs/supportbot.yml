#           SupportBot Configuration (supportbot.yml)

SupportBot_Version: "v8.4.1"

# -------------------------
#   General
# -------------------------

General:
  Name: "SupportBot"
  Token: "BOT_TOKEN"

  Addons:
    Enabled: true
    
# -------------------------
#  Activity
# -------------------------

Activity:
  Status: "SupportBot v8"
  Type: "Competing"
  StreamingURL: "https://www.twitch.tv/YOUR_TWITCH_NAME"

  # Available Types:
  # Playing
  # Watching
  # Listening
  # Competing
  # Streaming (URL required)

  # You can also update the activity via Discord using: /settings

# -------------------------
#  Embeds
# -------------------------

Embed:
  Colours:
    General: "#0cc559"
    Success: "#04b545"
    Error: "#d13030"
    Warn: "#fca117"

  Footer: "SupportBot | Developed by Emerald Development"

  # Use 0x<hexcode>  to change the colour of the embeds.

# -------------------------
#  Roles
# -------------------------

Roles:
  AutoRole:
    Enabled: true
    Role: "1111111111111111"

  StaffMember:
    Staff: "1111111111111111"
    Admin: "1111111111111111"
    Moderator: "1111111111111111"

  Mod:
    AllowSupportStaff: false

  # Allow Support Staff to use the /mod command. (More in detail customisation in commands.yml)

# ----------------------------
#  System Messages
# ----------------------------

Welcome: 
  Enabled: true
  Channel: "1111111111111111"

Leave: 
  Enabled: true
  Channel: "1111111111111111"

# ----------------------------
#  Suggestions
# ----------------------------

Suggestions:
  Mode: "Channel" # Channel or Forum
  ForumChannel: "1111111111111111"
  Channel: "1111111111111111"

  UpvoteEmoji: "✅"
  DownvoteEmoji: "❌"

  UpvoteTitle: "Yes"
  DownvoteTitle: "No"

  OwnSuggestion: true

  # If false this will not allow the user to vote for a suggestion they created
  # If true this will allow the user to vote for a suggestion they created

  ShowUsers: true
  
  Threads:
    Enabled: true
    Title: "Suggestion-releated Thread"
    Reason: "A thread releted to this suggestion"

  Buttons:
    Upvote: "2"
    Downvote: "2"
    RemoveVote: "4"
    RemoveVote_Title: "Remove Vote"

    # Available Button Styles
    # 1 - Blurple
    # 2 - Grey
    # 3 - Green
    # 4 - Red

  Tags:
   Created: "1111111111111111"
   Considering: "1111111111111111"
   Solved: "1111111111111111"
   Denied: "1111111111111111"

# -------------------------
#  Tickets
# -------------------------

VoiceTickets:
  Name: "%username%'s VC" 
  Category: "1111111111111111"

Ticket:
  TicketType: "threads" 

  # Available TicketTypes:
  # channels - Tickets will be created as channels in the TicketChannelsCategory
  # threads - Tickets will be created as threads through the "TicketHome" channel.

  TicketHome: "1111111111111111" 

  # What is TicketHome?
  # - Channel where the Ticket creation panel is sent.
  # - Channel where ticket threads are made. (only if ticket threads is enabled above.)

  # For TicketType: channels
  TicketChannelsCategory: "1111111111111111" 
  TicketChannelsCategory2: "1111111111111111" # This will be used if the first category has reached the max channel limit.
  TicketArchiveCategory: "1111111111111111"
  # ---

  Channel: "ticket-" # The prefix for ticket channel names
  TicketsPerUser: 100
  DMTranscripts: true
  TicketReason: true
  # If ticket reason is set to false, It will not prompt to create a reason

  TicketSubject: "description"

  # Available TicketSubjects:
  # "description" will display the ticket reason within the channel description
  # "embed" will display the ticket reason within the ticket embed

  Timeout: 5
  # Set to true to allow all staff to access the ticket

  Close:
    StaffOnly: true
    # Set to false is anyone is able to close a ticket.

    Confirmation_Button: "Confirm Close"
    Confirmation_Emoji: "🗑️"
    Confirmation_Style: "2"

    Title: "Are you sure you want to close this ticket?"

    # Available Button Styles:
    # 1 - Blurple
    # 2 - Grey
    # 3 - Green
    # 4 - Red

  Invites:
    StaffOnly: true

  ClaimTickets:
    Enabled: true
    Channel: "1111111111111111" 
    # Channel where the ticket assignments are sent for staff to claim.
    
    ClaimAcceptTime: 120000
    # How long the assigned user has to accept the ticket before it gets re-assigned to someone else.
    # 120000 = 2 Minutes
    # 180000 = 3 Minutes
    # 240000 = 4 Minutes
    # 300000 = 5 Minutes
    # Time in Mliseconds

    ButtonTitle: "Claim Ticket"
    ButtonEmoji: "🎫"
    Button: "1"

    # Available Button Styles
    # 1 - Blurple
    # 2 - Grey
    # 3 - Green
    # 4 - Red

  ReviewSystem:
    Enabled: false                
    Channel: "1111111111111111"
    UseModal: true

  Questions:
    Enabled: true  # Set to false to disable ticket questions
    List:
      - "Please provide your account email?"
      - "What is the nature of your issue?"
      - "Have you tried resolving the issue yourself?"

  Log:
    TicketDataLog: "1111111111111111"
    TickeDataTitle: "Ticket Data"
    TicketBlacklistLog: "1111111111111111"

# -------------------------
#  Buttons
# -------------------------
Buttons:
  General:
    Delete: "🗑️"
    DeleteStyle: "4"

  Voice:
    TicketDeleteText: "Delete Voice Channel"

  Tickets:
    ClaimEmoji: "🧑‍💻"
    ClaimStyle: "1"

    Unarchive: "Unarchive Ticket"
    Unarchive_Emoji: "♻️"
    Unarchive_Style: "2"

    Unlock: "Unlock Ticket"
    Unlock_Emoji: "🔓"
    Unlock_Style: "2"

    # Available Button Styles
    # 1 - Blurple
    # 2 - Grey
    # 3 - Green
    # 4 - Red

# -------------------------
#  Select Menus
# -------------------------

SelectMenus:
  Tickets:
    PanelEmoji: "⚙️"
    
    CloseEmoji: "🗑️"
    ArchiveEmoji: "♻️"
    LockEmoji: "🔐"
    RenameEmoji: "🏷️"
    VCEmoji: "🔊"

    EnableInvitesEmoji: "📤"
    DisableInvitesEmoji: "📥"

# -------------------------
#  Logging
# -------------------------

MessageDelete:
  Channel: "1111111111111111"
  Colour: "#d92525"

MessageUpdate:
  Channel: "1111111111111111"
  Colour: "#f2a024"

Translate:
  TranslateLog: "1111111111111111"
